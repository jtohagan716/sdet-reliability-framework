[project]
name = "labflow-system-under-test"
version = "0.1.0"
description = "Synthetic laboratory-order workflow for SDET and reliability training"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "psycopg[binary]==3.2.6",
    "alembic==1.15.2",
    "pydantic-settings==2.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["automation/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
markers = [
    "smoke: critical tests that quickly verify the application is usable",
    "regression: broader tests that verify existing behavior remains correct",
    "negative: tests that verify invalid input and error handling",
    "database: tests that validate PostgreSQL schemas, relationships, constraints, and transactions",
]