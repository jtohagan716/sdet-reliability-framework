name: SDET Reliability Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sdet-reliability-api .

      - name: Validate Docker image
        run: docker images sdet-reliability-api

  python-reliability-tests:
    runs-on: windows-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI service
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m uvicorn api_service.app:app --host 127.0.0.1 --port 8000"
          Start-Sleep -Seconds 5

      - name: Run Python reliability and security test suite
        run: python -m pytest -q

      - name: Run Performance CI Gate
        run: python scripts/ci_performance_gate.py

  playwright-automation-tests:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose observability stack
        run: |
          docker compose up -d --build
          sleep 5
          docker ps

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "FastAPI service is ready"
              exit 0
            fi

            echo "Waiting for FastAPI service... attempt $i"
            sleep 2
          done

          docker logs sdet-reliability-api || true
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run focused Playwright automation suite
        run: |
          npx playwright test \
            tests/ui/canary.spec.ts \
            tests/ui/fastapi_health.spec.ts \
            tests/ui/secure_patient_summary_api.spec.ts \
            tests/ui/e2e_security_workflow.spec.ts \
            tests/ui/fixture_inventory.spec.ts \
            tests/ui/fixture_role_behavior.spec.ts \
            tests/ui/fixture_security_api.spec.ts \
            tests/ui/performance_baseline.spec.ts \
            tests/ui/observability_validation.spec.ts \
            tests/ui/prometheus_validation.spec.ts \
            --project=chromium

      - name: Stop Docker Compose observability stack
        if: always()
        run: docker compose down