name: SDET Reliability Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sdet-reliability-api .

      - name: Validate Docker image exists
        run: docker images sdet-reliability-api

  python-reliability-tests:
    name: Python Reliability Tests
    runs-on: windows-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_CONNECTION_STRATEGY: connection_per_operation
      PATIENT_DATA_SOURCE: memory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null

          Start-Process python -ArgumentList "-m uvicorn api_service.app:app --host 127.0.0.1 --port 8000"

          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2

              if ($response.StatusCode -eq 200) {
                Write-Host "FastAPI service is ready"
                exit 0
              }
            }
            catch {
              Write-Host "Waiting for FastAPI service... attempt $i"
              Start-Sleep -Seconds 2
            }
          }

          throw "FastAPI service did not become ready"

      - name: Run API contract validation tests
        run: python -m pytest -q tests/test_api_contract_validation.py --junitxml=reports/api-contract-validation-results.xml

      - name: Run Python reliability, security, and contract test suite
        run: python -m pytest -q --junitxml=reports/pytest-results.xml

      - name: Run local API performance CI gate
        run: |
          python scripts/run_performance_baseline.py `
            --base-url http://127.0.0.1:8000 `
            --iterations 30 `
            --max-p95-ms 250 `
            --output reports/ci-performance-baseline.md

      - name: Upload Pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            reports/pytest-results.xml
            reports/api-contract-validation-results.xml
            reports/ci-performance-baseline.md
          if-no-files-found: warn

  api-and-ui-validation:
    name: API and UI Validation
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright-results.xml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose validation stack
        run: |
          docker compose up -d --build
          sleep 5
          docker ps

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "FastAPI service is ready"
              exit 0
            fi

            echo "Waiting for FastAPI service... attempt $i"
            sleep 2
          done

          docker logs sdet-reliability-api || true
          exit 1

      - name: Run PostgreSQL schema validation
        shell: pwsh
        run: |
          for ($i = 1; $i -le 30; $i++) {
            docker exec sdet-postgres pg_isready -U sdet_user -d sdet_reliability

            if ($LASTEXITCODE -eq 0) {
              Write-Host "PostgreSQL service is ready"
              break
            }

            if ($i -eq 30) {
              try {
                docker logs sdet-postgres
              }
              catch {
                Write-Host "Unable to read PostgreSQL logs"
              }

              throw "PostgreSQL service did not become ready"
            }

            Write-Host "Waiting for PostgreSQL service... attempt $i"
            Start-Sleep -Seconds 2
          }

          ./scripts/validate_postgresql_schema.ps1

      - name: Run PostgreSQL-backed patient lookup validation
        shell: pwsh
        run: |
          ./scripts/validate_postgresql_patient_lookup.ps1

      - name: Run API-to-database consistency validation
        shell: pwsh
        run: |
          ./scripts/validate_api_database_consistency.ps1

      - name: Run patient lookup query plan validation
        shell: pwsh
        run: |
          ./scripts/validate_patient_lookup_query_plan.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Postman REST API validation with Newman
        run: |
          mkdir -p reports
          npm run postman:test:report

      - name: Upload Newman API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-newman-results
          path: reports/postman-newman-results.xml
          if-no-files-found: warn

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run focused Playwright automation suite
        run: |
          mkdir -p reports
          npx playwright test \
            tests/ui/canary.spec.ts \
            tests/ui/fastapi_health.spec.ts \
            tests/ui/secure_patient_summary_api.spec.ts \
            tests/ui/e2e_security_workflow.spec.ts \
            tests/ui/fixture_inventory.spec.ts \
            tests/ui/fixture_role_behavior.spec.ts \
            tests/ui/fixture_security_api.spec.ts \
            tests/ui/performance_baseline.spec.ts \
            tests/ui/observability_validation.spec.ts \
            tests/ui/prometheus_validation.spec.ts \
            tests/ui/patient_lookup_accessibility.spec.ts \
            tests/ui/patient_lookup_axe_accessibility.spec.ts \
            --project=chromium \
            --reporter=line,junit

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: reports/playwright-results.xml
          if-no-files-found: warn

      - name: Stop Docker Compose validation stack
        if: always()
        run: docker compose down





