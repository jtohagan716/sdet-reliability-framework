name: SDET Reliability Framework CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-reliability-tests:
    runs-on: windows-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start synthetic echo service
        shell: pwsh
        run: |
          Start-Process python -ArgumentList "-m uvicorn api_service.app:app --host 127.0.0.1 --port 8000"
          Start-Sleep -Seconds 5

      - name: Run Python reliability test suite
        run: python -m pytest -q

      - name: Run Performance CI Gate
        run: python scripts/ci_performance_gate.py

  playwright-synthetic-canary:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run Playwright synthetic canary
        run: npx playwright test tests/ui/canary.spec.ts