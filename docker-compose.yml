services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdet-reliability-api:latest
    container_name: sdet-reliability-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s