services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdet-reliability-api:latest
    container_name: sdet-reliability-api
    ports:
      - "8000:8000"
    environment:
      PATIENT_DATA_SOURCE: postgres
      PATIENT_LOOKUP_DEFECT_MODE: none
      DATABASE_URL: postgresql://sdet_user:sdet_password@postgres:5432/sdet_reliability
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: sdet-postgres
    environment:
      POSTGRES_DB: sdet_reliability
      POSTGRES_USER: sdet_user
      POSTGRES_PASSWORD: sdet_password
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdet_user -d sdet_reliability"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: sdet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: sdet-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
